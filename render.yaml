services:
  - type: web
    name: statement-guard
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MAX_UPLOAD_MB
        value: "25"
      # Paste extra trusted root certificates (PEM), for example the CCA India root:
      - key: TRUSTED_ROOTS_PEM
        sync: false
